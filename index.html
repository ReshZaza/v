<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Valentine Message</title>
    <style>
        :root {
            --primary-pink: #ffadad;
            --dark-pink: #ff4d6d;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff0f3;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* กล่องซองจดหมาย */
        #envelope-container {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
            z-index: 100;
        }

        #envelope-container:hover {
            transform: scale(1.1);
        }

        .envelope-icon {
            font-size: 100px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
        }

        /* ส่วนของ Password */
        #password-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 243, 0.95);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        input {
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid var(--primary-pink);
            border-radius: 10px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 25px;
            background: var(--dark-pink);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* ส่วนเนื้อหาหลักหลังปลดล็อค */
        #main-content {
            display: none;
            text-align: center;
            animation: fadeIn 2s forwards;
        }

        h1 { color: var(--dark-pink); font-size: 2.5rem; text-shadow: 2px 2px white; }

        /* สไตล์รูปลอย */
        .floating-img {
            position: absolute;
            bottom: -150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 5;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="envelope-container" onclick="showPasswordScreen()">
        <div class="envelope-icon">✉️</div>
        <p style="color: #ff4d6d;">คุณได้รับจดหมายลับ 1 ฉบับ</p>
    </div>

    <div id="password-screen">
        <h3>ใส่รหัสผ่านเพื่อเปิดอ่าน</h3>
        <input type="password" id="passInput" placeholder="ววดดปปปป">
        <button onclick="checkPassword()">เปิดจดหมาย</button>
        <p id="error-msg" style="color: red; display: none; margin-top: 10px;">รหัสไม่ถูกต้อง ลองใหม่นะที่รัก!</p>
    </div>

    <div id="main-content">
        <h1>Happy Valentine's Day! ❤️</h1>
        <p>รักที่สุดเลยนะคนดี</p>
    </div>

    <script>
        // --- ส่วนที่ต้องแก้: ใส่ชื่อไฟล์รูปแฟนของคุณตรงนี้ ---
        const photoUrls = [
            'fan1.jpg', 
            'fan2.jpg', 
            'fan3.jpg'
        ];

        function showPasswordScreen() {
            document.getElementById('envelope-container').style.display = 'none';
            document.getElementById('password-screen').style.display = 'flex';
            document.getElementById('passInput').focus();
        }

        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            if (pass === '14022026') {
                unlockSecret();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function unlockSecret() {
            document.getElementById('password-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            
            // เริ่มการลอยของรูป
            setInterval(createFloatingPhoto, 700);
        }

        function createFloatingPhoto() {
            const img = document.createElement('img');
            // สุ่มรูปจากลิสต์
            img.src = photoUrls[Math.floor(Math.random() * photoUrls.length)];
            img.className = 'floating-img';
            
            // สุ่มตำแหน่งและขนาด
            const size = Math.random() * 60 + 80;
            img.style.width = size + 'px';
            img.style.height = size + 'px';
            img.style.left = Math.random() * 90 + 'vw';
            
            // สุ่มความเร็ว
            const duration = Math.random() * 5 + 5;
            img.style.animationDuration = duration + 's';

            document.body.appendChild(img);

            setTimeout(() => { img.remove(); }, duration * 1000);
        }

        // กด Enter เพื่อเช็ครหัสได้
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
